  document.querySelectorAll('[data-bg]').forEach(fillBg);

  const panels = ['about', 'music'];
  const KAZI_ID = 'KAZI';
  const icon = (id, cls) => `<svg class="ic ${cls} pointer-events-none"><use href="#${id}"/></svg>`;
  const playIcon = icon('i-py', 'w-4 h-4 fill-current ml-1');
  const pauseIcon = icon('i-pa', 'w-4 h-4 fill-current');
  const isVideo = u => /\.(mp4|webm|ogv|mov)(\?|#|$)/i.test(u);

  const audio = $('audio-player');
  const cover = $('music-cover');
  const playBtn = $('play-btn');
  const mainArea = $('main-area');
  const introContent = $('intro-content');

  const musicId = ytId(cfg.music);
  const coverUrl = esc(cfg.musicCover) || (musicId ? `https://i.ytimg.com/vi/${musicId}/mqdefault.jpg` : esc(cfg.centerImage));
  cover.innerHTML = isVideo(coverUrl)
    ? `<video class="w-full h-full object-cover" src="${coverUrl}" autoplay loop muted playsinline></video>`
    : `<img class="w-full h-full object-cover" src="${coverUrl}" alt="">`;
  $('music-title').textContent = cfg.songTitle || '';
  $('music-artist').textContent = cfg.songArtist || '';

  let panelIndex = -1;
  let isPlaying = false;
  let statusTimer = null;

  const frag = document.createDocumentFragment();
  const colors = ['#ffffff', '#c7d2fe', '#93a5e8', '#5a6fb0'];
  const count = window.innerWidth < 768 ? 60 : 110;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    const size = Math.random() * 2 + 0.8;
    const c = colors[(Math.random() * colors.length) | 0];
    s.className = 'star';
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random() * 100}vw;top:${Math.random() * 100}vh;background:${c};box-shadow:0 0 ${size * 2}px ${c};--duration:${Math.random() * 3 + 1.5}s;animation-delay:${Math.random() * 5}s`;
    frag.appendChild(s);
  }
  $('stars-container').appendChild(frag);

  setTimeout(() => {
    introContent.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
    introContent.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
  }, 1500);

  const setStatus = (label, online) => {
    const c = online === null ? '#eab308' : online ? '#22c55e' : '#ef4444';
    const ind = $('status-indicator');
    const txt = $('status-text');
    ind.style.backgroundColor = c;
    ind.style.boxShadow = '0 0 8px ' + c;
    txt.textContent = label;
    txt.style.color = c;
  };

  const checkStatus = async () => {
    setStatus('LOADING', null);
    try {
      const r = await fetch('https://illuxat.com/api/online/' + KAZI_ID);
      if (!r.ok) throw 0;
      const d = await r.json();
      const s = d && d.data && d.data.status ? String(d.data.status).toLowerCase() : '';
      if (s === 'online') setStatus('ONLINE', true);
      else setStatus(s === 'available' ? 'AVAILABLE' : 'OFFLINE', false);
    } catch (_) {
      setStatus('OFFLINE', false);
    }
  };

  const closePanels = () => {
    panelIndex = -1;
    mainArea.classList.remove('panel-open');
    document.querySelectorAll('.floating-panel').forEach(p => p.classList.remove('active-panel'));
  };
  const openPanel = id => {
    panelIndex = panels.indexOf(id);
    document.querySelectorAll('.floating-panel').forEach(p => p.classList.remove('active-panel'));
    mainArea.classList.add('panel-open');
    const p = $(id + '-panel');
    if (p) p.classList.add('active-panel');
  };
  const stepPanel = dir => {
    panelIndex += dir;
    if (panelIndex >= panels.length) panelIndex = -1;
    if (panelIndex < -1) panelIndex = panels.length - 1;
    panelIndex === -1 ? closePanels() : openPanel(panels[panelIndex]);
  };

  const setPlaying = v => {
    isPlaying = v;
    cover.classList.toggle('paused-spin', !v);
    playBtn.innerHTML = v ? pauseIcon : playIcon;
  };

  let yt = null;
  let ytReady = false;
  let wantPlay = false;
  const player = musicId ? {
    play: () => { wantPlay = true; if (ytReady) yt.playVideo(); },
    pause: () => { wantPlay = false; if (ytReady) yt.pauseVideo(); },
    restart: () => { if (ytReady) yt.seekTo(0, true); }
  } : {
    play: () => { const p = audio.play(); if (p) p.catch(() => setPlaying(false)); },
    pause: () => audio.pause(),
    restart: () => { audio.currentTime = 0; }
  };

  if (musicId) {
    window.onYouTubeIframeAPIReady = () => {
      yt = new YT.Player('yt-music', {
        videoId: musicId,
        playerVars: { controls: 0, disablekb: 1, playsinline: 1, loop: 1, playlist: musicId, rel: 0 },
        events: {
          onReady: () => { ytReady = true; yt.setVolume(100); if (wantPlay) yt.playVideo(); },
          onStateChange: e => { if (e.data === 1) setPlaying(true); else if (e.data === 0 || e.data === 2) setPlaying(false); }
        }
      });
    };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  } else {
    audio.src = esc(cfg.music);
    audio.addEventListener('play', () => setPlaying(true));
    audio.addEventListener('pause', () => setPlaying(false));
  }

  const toggle = () => (isPlaying ? player.pause() : player.play());
  const restart = () => { player.restart(); player.play(); };

  const actions = {
    enter: () => {
      intro.classList.add('intro-hidden');
      if (bgId) introBg.innerHTML = '';
      checkStatus();
      if (!statusTimer) statusTimer = setInterval(checkStatus, 60000);
      if (!isPlaying) player.play();
    },
    intro: () => {
      if (bgId) fillBg(introBg);
      intro.classList.remove('intro-hidden');
      if (isPlaying) player.pause();
      closePanels();
    },
    close: closePanels,
    about: () => openPanel('about'),
    music: () => openPanel('music'),
    prev: () => stepPanel(-1),
    next: () => stepPanel(1),
    toggle,
    prevSong: restart,
    nextSong: restart
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]');
    if (el && actions[el.dataset.a]) actions[el.dataset.a]();
  });

})();
